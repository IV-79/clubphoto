<div class="admin-page">

  <div class="page-header">
    <h2 class="admin-title">Événements</h2>
    <button mat-raised-button color="primary">
      <mat-icon>event_note</mat-icon>
      Nouvel événement
    </button>
  </div>

  @if (evenements.length === 0) {
    <div class="empty-state">
      <mat-icon>event_busy</mat-icon>
      <p>Aucun événement pour l'instant.</p>
    </div>
  } @else {
    <div class="evenements-list">
      @for (evt of evenements; track evt.id) {
        <mat-card class="evenement-card">
          <mat-card-header>
            <mat-icon mat-card-avatar>event</mat-icon>
            <mat-card-title>{{ evt.titre }}</mat-card-title>
            <mat-card-subtitle>{{ evt.date }}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <p>{{ evt.description }}</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button color="primary">Modifier</button>
            <button mat-button color="warn">Supprimer</button>
          </mat-card-actions>
        </mat-card>
      }
    </div>
  }

</div>
