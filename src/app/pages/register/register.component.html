<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Créer un compte</mat-card-title>
      <mat-card-subtitle>Club Photo</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Nom complet</mat-label>
          <input matInput type="text" name="nom" [(ngModel)]="nom" required minlength="2">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Adresse email</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="email" required email>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input matInput type="password" name="password" [(ngModel)]="password" required minlength="6">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Confirmer le mot de passe</mat-label>
          <input matInput type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required>
        </mat-form-field>

        @if (errorMessage) {
          <p class="error-text">{{ errorMessage }}</p>
        }

        <button mat-raised-button color="primary" type="submit"
          [disabled]="!registerForm.form.valid || loading" class="full-width">
          {{ loading ? 'Création en cours...' : "S'inscrire" }}
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions>
      <p class="login-link">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
    </mat-card-actions>
  </mat-card>
</div>
