<div class="creer-page">
  <div class="page-header">
    <h1>Organiser une sortie photo</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="sortie-form">

    <mat-form-field appearance="outline" class="field-full">
      <mat-label>Titre *</mat-label>
      <input matInput formControlName="titre" placeholder="Ex: Sortie au bords du Rhône" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"
        placeholder="Décrivez la sortie, le thème, les objectifs..."></textarea>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline" class="field-half">
        <mat-label>Date *</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" [min]="minDate" />
        <mat-datepicker-toggle matIconSuffix [for]="picker" />
        <mat-datepicker #picker />
      </mat-form-field>

      <mat-form-field appearance="outline" class="field-half">
        <mat-label>Lieu *</mat-label>
        <input matInput formControlName="lieu" placeholder="Ex: Parc de la Tête d'Or, Lyon" />
        <mat-icon matSuffix>place</mat-icon>
      </mat-form-field>
    </div>

    <div class="checkboxes">
      <mat-checkbox formControlName="inscriptionObligatoire" color="primary">
        Inscription obligatoire pour participer
      </mat-checkbox>

      @if (inscriptionObligatoire) {
        <mat-checkbox formControlName="uploadParticipantsOnly" color="primary" class="sub-checkbox">
          Limiter l'upload aux participants inscrits
        </mat-checkbox>
      }
    </div>

    @if (inscriptionObligatoire) {
      <mat-form-field appearance="outline" class="field-half">
        <mat-label>Nombre max de participants</mat-label>
        <input matInput type="number" formControlName="maxParticipants" min="1" placeholder="Optionnel" />
      </mat-form-field>
    }

    <div class="form-actions">
      <a routerLink="/galeries/sorties" class="btn-cancel">Annuler</a>
      <button type="submit" class="btn-submit" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Création…' : 'Créer la sortie' }}
      </button>
    </div>

  </form>
</div>
